<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12233B"/>
      <stop offset="1" stop-color="#0C192B"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCC08A"/>
      <stop offset="1" stop-color="#C9A96A"/>
    </linearGradient>
    <linearGradient id="desvanece" gradientUnits="userSpaceOnUse" x1="690" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascara"><rect x="600" y="0" width="600" height="300" fill="url(#desvanece)"/></mask>
    <pattern id="plano" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7FA3CC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="ventanas" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="8" rx="1" fill="#C9A96A" fill-opacity="0.34"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#fondo)"/>
  <rect width="1200" height="300" fill="url(#plano)"/>

  <!-- edificios: la industria en la que trabajo -->
  <g mask="url(#mascara)">
    <g fill="#1B3354">
      <rect x="700" y="190" width="70" height="110"/>
      <rect x="780" y="150" width="56" height="150"/>
      <rect x="846" y="108" width="84" height="192"/>
      <rect x="940" y="170" width="60" height="130"/>
      <rect x="1010" y="64" width="96" height="236"/>
      <rect x="1116" y="138" width="84" height="162"/>
    </g>
    <g fill="url(#ventanas)">
      <rect x="700" y="190" width="70" height="110"/>
      <rect x="780" y="150" width="56" height="150"/>
      <rect x="846" y="108" width="84" height="192"/>
      <rect x="940" y="170" width="60" height="130"/>
      <rect x="1010" y="64" width="96" height="236"/>
      <rect x="1116" y="138" width="84" height="162"/>
    </g>
    <rect x="1010" y="64" width="96" height="3" fill="#C9A96A"/>
    <rect x="846" y="108" width="84" height="3" fill="#C9A96A" fill-opacity="0.6"/>
  </g>

  <!-- línea de suelo -->
  <rect x="0" y="296" width="1200" height="4" fill="#C9A96A" fill-opacity="0.85"/>

  <!-- texto -->
  <rect x="80" y="84" width="6" height="132" rx="3" fill="url(#oro)"/>
  <text x="110" y="136" fill="#FAFAF7" font-size="56" font-weight="500" font-family="Georgia, 'Times New Roman', serif">Nico Ramdohr</text>
  <text x="112" y="177" fill="#DCE6F2" font-size="23" font-weight="500">Fundador de Intelify · Intelify Inmo App</text>
  <text x="112" y="212" fill="#8FA3BF" font-size="17">Sistema de venta inmobiliaria con IA — del lead a la reserva</text>
  <text x="112" y="238" fill="#C9A96A" font-size="14" letter-spacing="1.6">INMOBILIARIAS Y CORREDORAS · CHILE</text>
</svg>
